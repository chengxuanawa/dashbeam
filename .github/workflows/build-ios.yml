name: build-ios-unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build frontend
        run: nix develop --command bash -c "pnpm build:wasm && pnpm build"

      - name: Install native iOS toolchain
        run: |
          brew install xcodegen cocoapods
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          rustup override set stable
          if [ -x /nix/var/nix/profiles/default/bin/nix ]; then
            sudo mv /nix/var/nix/profiles/default/bin/nix /nix/var/nix/profiles/default/bin/nix.disabled
          fi

      - name: Generate Xcode project
        run: pnpm tauri ios init

      - name: Build unsigned app
        run: pnpm tauri ios build --no-sign

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -n1 || true)
          if [ -n "$IPA" ]; then
            cp "$IPA" DashBeam-unsigned.ipa
            exit 0
          fi

          APP=$(find src-tauri/gen/apple -name '*.app' -type d | grep -v '/PlugIns/' | head -n1 || true)
          test -n "$APP"

          rm -rf Payload DashBeam-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DashBeam-unsigned.ipa Payload
          tar -czf DashBeam-unsigned-app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS-unsigned
          path: |
            DashBeam-unsigned.ipa
            DashBeam-unsigned-app.tar.gz
