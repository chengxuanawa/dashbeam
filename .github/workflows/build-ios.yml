name: build-ios-unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build frontend
        run: nix develop --command bash -c "pnpm build:wasm && pnpm build"

      - name: Generate Xcode project
        run: nix develop .#ios --command pnpm tauri ios init

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -n1)
          test -n "$PROJ"

          SCHEME=$(xcodebuild -list -json -project "$PROJ" \
            | jq -r '.project.schemes[]' | grep '_iOS$' | head -n1 || true)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list -json -project "$PROJ" | jq -r '.project.schemes[0]')
          fi

          echo "Building $PROJ / $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)
          test -n "$APP"

          rm -rf Payload DashBeam-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DashBeam-unsigned.ipa Payload
          tar -czf DashBeam-unsigned-app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: DashBeam-iOS-unsigned
          path: |
            DashBeam-unsigned.ipa
            DashBeam-unsigned-app.tar.gz
