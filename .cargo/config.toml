# The Rust library calls Swift `@_cdecl` functions that Xcode links into the
# app target, not into the Rust cdylib. Let the cdylib carry those symbols as
# dynamic lookups; the final app link resolves them against the Swift objects.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
